services:
  - type: web
    name: workmates-core
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn 'frontend:create_app()' --bind 0.0.0.0:$PORT --workers 1 --threads 8 --timeout 60 --access-logfile -
    healthCheckPath: /healthz
    envVars:
      - key: WORKMATES_API_URL
        sync: false
